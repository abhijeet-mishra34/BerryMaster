name: Build & Release (Android APK & Windows Desktop)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional Release Tag (e.g. v0.1.0) to publish to GitHub Releases'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Initialize Tauri Android project
        run: npx tauri android init

      - name: Generate & Apply Platform App Icons
        run: |
          npx tauri icon src/assets/brand/berrymaster-icon.png
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          cp -r src-tauri/icons/android/mipmap-* src-tauri/gen/android/app/src/main/res/ || true
          cp -r src-tauri/icons/android/values/* src-tauri/gen/android/app/src/main/res/values/ || true

      - name: Build Android APK (Release)
        run: npx tauri android build --apk

      - name: Setup Signing Keystore
        run: |
          mkdir -p .github/keystores
          if [ -f ".github/keystores/release.keystore" ]; then
            echo "Using existing persistent keystore..."
            cp .github/keystores/release.keystore release.keystore
          elif [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from GitHub secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            cp release.keystore .github/keystores/release.keystore
          else
            echo "Creating permanent release keystore..."
            keytool -genkey -v -keystore .github/keystores/release.keystore \
              -alias berrymaster \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass berrymaster123 \
              -keypass berrymaster123 \
              -dname "CN=BerryMaster, OU=App, O=BerryMaster, C=US"
            cp .github/keystores/release.keystore release.keystore

            # Commit the keystore back to repo so all future builds are signed with this exact key
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/keystores/release.keystore
            git commit -m "chore: persist Android release signing keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Sign & Align Android APKs
        run: |
          mkdir -p dist-apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          # Extract tag name
          TAG="${{ github.event.inputs.release_tag || github.ref_name || 'latest' }}"
          TAG="${TAG#refs/tags/}"

          # Find and sign all APKs
          find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*.apk" | while read -r apk_path; do
            echo "Processing $apk_path..."
            filename=$(basename "$apk_path")
            
            # Determine clean output name
            if [[ "$filename" == *"universal"* ]]; then
              out_name="BerryMaster-${TAG}-universal.apk"
              alias_name="BerryMaster-universal.apk"
            elif [[ "$filename" == *"arm64_v8a"* ]] || [[ "$filename" == *"arm64-v8a"* ]]; then
              out_name="BerryMaster-${TAG}-arm64-v8a.apk"
              alias_name="BerryMaster-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi_v7a"* ]] || [[ "$filename" == *"armeabi-v7a"* ]]; then
              out_name="BerryMaster-${TAG}-armeabi-v7a.apk"
              alias_name="BerryMaster-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              out_name="BerryMaster-${TAG}-x86_64.apk"
              alias_name="BerryMaster-x86_64.apk"
            else
              out_name="BerryMaster-${TAG}-${filename}"
              alias_name="BerryMaster-${filename}"
            fi

            aligned_apk="dist-apk/aligned_${filename}"
            signed_apk="dist-apk/${out_name}"

            # Zipalign
            "$BUILD_TOOLS/zipalign" -p -f -v 4 "$apk_path" "$aligned_apk" || cp "$apk_path" "$aligned_apk"

            # Sign with apksigner (v1, v2, and v3 schemes)
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:berrymaster123 \
              --ks-key-alias berrymaster \
              --key-pass pass:berrymaster123 \
              --out "$signed_apk" \
              "$aligned_apk"

            # Verify signature
            "$BUILD_TOOLS/apksigner" verify --verbose "$signed_apk"

            # Also create the permanent static alias copy for 1-click downloads
            if [ -n "$alias_name" ]; then
              cp "$signed_apk" "dist-apk/${alias_name}"
            fi

            # Clean up temporary aligned file
            rm -f "$aligned_apk"
          done

          echo "--- Signed APKs ready in dist-apk/ ---"
          ls -lh dist-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BerryMaster-Android-APK
          path: dist-apk/*.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            dist-apk/BerryMaster-universal.apk
            dist-apk/BerryMaster-arm64-v8a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Build Windows Desktop Bundle
        run: npx tauri build

      - name: Stage Windows Installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Get-ChildItem -Recurse "src-tauri\target\release\bundle" -Include *.exe | Copy-Item -Destination dist-windows
          $exe = Get-ChildItem "dist-windows\*.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "dist-windows\BerryMaster-Windows-Setup.exe" -Force }
          Get-ChildItem dist-windows

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BerryMaster-Windows-Installer
          path: dist-windows/*.exe
          retention-days: 14

      - name: Publish Windows Installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist-windows/BerryMaster-Windows-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
