<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Berry Jewel Primary Gradient -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Emerald Leaf Center Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Leaf Left Gradient -->
    <linearGradient id="leafLeftGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Leaf Right Gradient -->
    <linearGradient id="leafRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Jewel Specular Gradient -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="jewelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35"/>
    </filter>

    <filter id="leafShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Emerald Foliage Group -->
    <g filter="url(#leafShadow)">
      <!-- Left Calyx / Outer Leaf -->
      <path d="M165 245 C115 255 120 318 175 310 C185 280 185 258 165 245 Z" fill="url(#leafLeftGrad)" stroke="#6ee7b7" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Right Calyx / Outer Leaf -->
      <path d="M347 245 C397 255 392 318 337 310 C327 280 327 258 347 245 Z" fill="url(#leafRightGrad)" stroke="#6ee7b7" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Top Left Leaf -->
      <path d="M232 135 C168 120 152 170 190 215 C222 205 240 178 232 135 Z" fill="url(#leafLeftGrad)" stroke="#a7f3d0" stroke-width="3" stroke-linejoin="round"/>
      <!-- Top Right Leaf -->
      <path d="M280 135 C344 120 360 170 322 215 C290 205 272 178 280 135 Z" fill="url(#leafRightGrad)" stroke="#a7f3d0" stroke-width="3" stroke-linejoin="round"/>
      <!-- Crown Center Leaf -->
      <path d="M256 85 C215 130 225 188 256 210 C287 188 297 130 256 85 Z" fill="url(#leafGrad)" stroke="#6ee7b7" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Leaf Spine Highlights -->
      <path d="M256 95 Q256 150 256 200" stroke="#d1fae5" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>
      <path d="M205 150 Q225 180 240 195" stroke="#d1fae5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M307 150 Q287 180 272 195" stroke="#d1fae5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Faceted Ruby Berry Body -->
    <g filter="url(#jewelShadow)">
      <!-- Main Diamond Body Outline -->
      <path d="M256 195 L345 250 L315 365 L256 430 L197 365 L167 250 Z" fill="url(#rubyGrad)" stroke="#fda4af" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Upper Left Lateral Facet -->
      <path d="M167 250 L212 250 L256 195 Z" fill="#fb7185" opacity="0.85"/>
      <!-- Upper Right Lateral Facet -->
      <path d="M345 250 L300 250 L256 195 Z" fill="#f43f5e" opacity="0.9"/>
      <!-- Top Center Diamond Facet -->
      <path d="M256 195 L300 250 L256 278 L212 250 Z" fill="#ff7597" opacity="0.95"/>

      <!-- Mid-Left Outer Facet -->
      <path d="M167 250 L212 250 L197 365 Z" fill="#e11d48" opacity="0.92"/>
      <!-- Mid-Right Outer Facet -->
      <path d="M345 250 L300 250 L315 365 Z" fill="#be123c" opacity="0.92"/>

      <!-- Lower Left Triangle Facet -->
      <path d="M256 278 L212 250 L197 365 L256 430 Z" fill="#e11d48" opacity="0.96"/>
      <!-- Lower Right Triangle Facet -->
      <path d="M256 278 L300 250 L315 365 L256 430 Z" fill="#9f1239" opacity="0.96"/>

      <!-- Center Ruby Core Cut -->
      <path d="M256 278 L288 335 L256 395 L224 335 Z" fill="#ff2d55" stroke="#fda4af" stroke-width="1.8" opacity="0.98"/>

      <!-- Top Diamond Inner Highlight Specular -->
      <path d="M256 205 L288 245 L256 265 L224 245 Z" fill="url(#specularGrad)" opacity="0.5"/>

      <!-- Facet Crease Highlights -->
      <line x1="256" y1="195" x2="256" y2="278" stroke="#ffffff" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
      <line x1="256" y1="278" x2="256" y2="425" stroke="#ffffff" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
      <line x1="212" y1="250" x2="300" y2="250" stroke="#ffe4e6" stroke-width="1.8" opacity="0.65"/>

      <!-- Sparkling Glints & Stars -->
      <!-- Center Star Glint -->
      <polygon points="256,210 260,224 274,224 263,233 266,246 256,238 246,246 249,233 238,224 252,224" fill="#ffffff" opacity="0.98"/>
      <!-- Facet Sparkles -->
      <circle cx="205" cy="272" r="4.5" fill="#ffffff" opacity="0.92"/>
      <circle cx="205" cy="272" r="9" fill="#ffffff" opacity="0.25"/>
      <circle cx="305" cy="305" r="3.5" fill="#ffffff" opacity="0.88"/>
      <circle cx="305" cy="305" r="7" fill="#ffffff" opacity="0.2"/>
      <circle cx="256" cy="365" r="2.5" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>
</svg>